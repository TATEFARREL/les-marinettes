[project]
name = "les-marinettes"
version = "0.1.0"
description = "Les Marinettes school site + FastAPI CMS, admissions, finance"
requires-python = ">=3.11"
dependencies = [
    # --- Core Web & Server ---
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    
    # --- Database & CRUD (Benavlabs aligned) ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "fastcrud>=0.19.0", # Added: Removes boilerplate CRUD code
    
    # --- Auth & Security ---
    "PyJWT[crypto]>=2.8.0", # Fixed: Replaced abandoned python-jose
    "bcrypt>=4.0.0",
    
    # --- Background Jobs & Caching (Benavlabs aligned) ---
    "redis>=5.0.0", # Added: Async Redis client
    "arq>=0.26.0",  # Added: Redis-backed task queue for emails/finance
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0", # Added: Crucial for FastAPI/Pydantic type checking
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
# Added "FAST" to lint for FastAPI specific edge-cases
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/admissions.py" = ["B008"]
"app/api/routes/cms.py" = ["B008"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Added: Basic mypy config to handle SQLAlchemy/Pydantic
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]