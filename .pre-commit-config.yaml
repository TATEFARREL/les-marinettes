repos:
  # 1. Run the fast, standard hygiene checks first
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml          # Added: validates your pyproject.toml syntax
      - id: check-merge-conflict # Added: prevents committing unresolved git conflicts
      - id: debug-statements    # Added: catches stray breakpoint() calls

  # 2. Run Ruff (Linting & Formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # 3. Run Mypy (Type Checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy (auth-service)
        args: ["--config-file", "services/auth-service/pyproject.toml"]
        files: ^services/auth-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings
      - id: mypy
        name: mypy (cms-service)
        args: ["--config-file", "services/cms-service/pyproject.toml"]
        files: ^services/cms-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings
      - id: mypy
        name: mypy (admissions-service)
        args: ["--config-file", "services/admissions-service/pyproject.toml"]
        files: ^services/admissions-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings
      - id: mypy
        name: mypy (finance-service)
        args: ["--config-file", "services/finance-service/pyproject.toml"]
        files: ^services/finance-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings
      - id: mypy
        name: mypy (notification-service)
        args: ["--config-file", "services/notification-service/pyproject.toml"]
        files: ^services/notification-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings
      - id: mypy
        name: mypy (innoter-service)
        args: ["--config-file", "services/innoter-service/pyproject.toml"]
        files: ^services/innoter-service/
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - pydantic-settings